<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JUZ40 Design</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f7);
    --text: var(--tg-theme-text-color, #14161a);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #2a7de1);
    --btn: var(--tg-theme-button-color, #2a7de1);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    /* Жұмыс түрлерінің «бояу үлгілері» */
    --c-post: #6c4ce3; --c-car: #1e9bd7; --c-cov: #f2a33a; --c-oth: #2fb57a; --bad: #e5484d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: 0 0 calc(24px + env(safe-area-inset-bottom)); }
  header { padding: 18px 16px 6px; background: var(--bg); }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  .range { color: var(--hint); margin-top: 2px; }
  .row { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; background: var(--bg); scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 14px;
    background: var(--bg2); color: var(--text); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-text); }
  .chip:focus-visible, .tab:focus-visible, button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  nav { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border-bottom: 1px solid color-mix(in srgb, var(--hint) 25%, transparent); }
  .tab { border: 0; background: none; font: inherit; padding: 12px 0; color: var(--hint); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--btn); font-weight: 600; }
  main { padding: 14px 16px; }
  section[hidden] { display: none; }

  /* Бояу үлгісі (swatch) — дизайнерлердің палитра карточкасы */
  .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .swatch { border-radius: 14px; overflow: hidden; background: var(--bg); }
  .swatch .color { height: 86px; padding: 12px 14px; color: #fff; display: flex; align-items: flex-end; justify-content: space-between; }
  .swatch .num { font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .swatch .delta { font-size: 13px; background: rgba(255,255,255,.22); padding: 3px 7px; border-radius: 999px; }
  .swatch .name { padding: 8px 14px 10px; font-size: 14px; }
  .swatch .name small { color: var(--hint); display: block; font-size: 12px; }

  h2 { font-size: 17px; margin: 22px 0 8px; }
  .list { background: var(--bg); border-radius: 14px; overflow: hidden; }
  .item { padding: 11px 14px; display: flex; gap: 10px; align-items: baseline; border-top: 1px solid var(--bg2); }
  .item:first-child { border-top: 0; }
  .item .main { flex: 1; min-width: 0; }
  .item .t { overflow: hidden; text-overflow: ellipsis; }
  .item .s { color: var(--hint); font-size: 13px; }
  .item .r { font-size: 13px; text-align: right; white-space: nowrap; }
  .bad { color: var(--bad); }
  .empty { color: var(--hint); padding: 22px 14px; text-align: center; background: var(--bg); border-radius: 14px; }
  .chart { background: var(--bg); border-radius: 14px; padding: 12px; }
  .actions { margin-top: 18px; }
  .btn { width: 100%; border: 0; border-radius: 12px; padding: 13px; font: inherit; font-weight: 600; background: var(--btn); color: var(--btn-text); cursor: pointer; }
  @media (prefers-reduced-motion: no-preference) { .swatch .color { transition: filter .2s; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Есеп</h1>
  <div class="range" id="range">Жүктелуде…</div>
</header>
<div class="row" id="people" hidden></div>
<div class="row" id="weeks"></div>
<nav role="tablist">
  <button class="tab" role="tab" aria-selected="true" data-tab="week">Апта</button>
  <button class="tab" role="tab" aria-selected="false" data-tab="trend">Динамика</button>
  <button class="tab" role="tab" aria-selected="false" data-tab="open">Ашық тапсырмалар</button>
</nav>
<main>
  <section id="tab-week">
    <div class="swatches" id="swatches"></div>
    <h2>Пәндер мен аккаунттар</h2>
    <div class="list" id="subjects"></div>
    <h2>Тапсырмалар</h2>
    <div class="list" id="tasks"></div>
    <div class="actions" id="actions" hidden><button class="btn" id="export">Excel-ді чатқа жіберу</button></div>
  </section>
  <section id="tab-trend" hidden>
    <div class="chart"><canvas id="chart" height="260" aria-label="Соңғы 8 аптаның динамикасы"></canvas></div>
  </section>
  <section id="tab-open" hidden>
    <div class="list" id="open"></div>
  </section>
</main>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const state = { me: null, monday: null, designer: "", tab: "week", chart: null };
const COLORS = { "Пост": "--c-post", "Карусель": "--c-car", "Обложка": "--c-cov", "Басқа": "--c-oth" };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Init-Data": tg?.initData ?? "" } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Қате");
  return j;
}
const qs = () => `monday=${state.monday}&designer=${encodeURIComponent(state.designer)}`;

function chips(el, items, current, onPick) {
  el.innerHTML = items.map((i) => `<button class="chip" aria-pressed="${i.value === current}" data-v="${esc(i.value)}">${esc(i.label)}</button>`).join("");
  el.querySelectorAll(".chip").forEach((b) => (b.onclick = () => { tg?.HapticFeedback?.selectionChanged(); onPick(b.dataset.v); }));
}

function delta(now, prev) {
  if (!prev && !now) return "";
  if (!prev) return "жаңа";
  const p = Math.round(((now - prev) / prev) * 100);
  return p === 0 ? "өзгеріссіз" : `${p > 0 ? "+" : "−"}${Math.abs(p)}%`;
}

async function loadWeek() {
  const w = await api(`/api/week?${qs()}`);
  document.getElementById("range").textContent = w.range;
  document.getElementById("swatches").innerHTML = Object.entries(w.totals).map(([k, v]) => {
    const d = delta(v, w.prev[k]);
    return `<div class="swatch"><div class="color" style="background:var(${COLORS[k]})"><span class="num">${v}</span>${d ? `<span class="delta">${d}</span>` : ""}</div>
      <div class="name">${k}<small>өткен апта: ${w.prev[k]}</small></div></div>`;
  }).join("");
  document.getElementById("subjects").innerHTML = w.subjects.length
    ? w.subjects.map((s) => `<div class="item"><span>${s.icon}</span><div class="main"><div class="t">${esc(s.name)}</div><div class="s">${esc(s.text)}</div></div></div>`).join("")
    : `<div class="empty">Бұл аптада есептелген жұмыс жоқ</div>`;
  document.getElementById("tasks").innerHTML = w.tasks.length
    ? w.tasks.map((t) => `<div class="item"><div class="main"><div class="t">${esc(t.title)}</div>
        <div class="s">${esc(t.subject)}${state.me.full && !state.designer ? " · " + esc(t.designer) : ""}${t.date ? " · " + esc(t.date) : ""}</div></div>
        <div class="r ${t.problem ? "bad" : ""}">${esc(t.result)}<div class="s">${t.files} файл · ${esc(t.status)}</div></div></div>`).join("")
    : `<div class="empty">Тапсырма жоқ. Дайын файлды YouGile чатына салып, тапсырманы ✓ белгілеңіз.</div>`;
}

async function loadTrend() {
  const t = await api(`/api/trend?${qs()}`);
  const ctx = document.getElementById("chart");
  state.chart?.destroy();
  state.chart = new Chart(ctx, {
    type: "bar",
    data: { labels: t.map((x) => x.label), datasets: Object.keys(COLORS).map((k) => ({ label: k, data: t.map((x) => x[k]), backgroundColor: css(COLORS[k]), borderRadius: 4 })) },
    options: { responsive: true, plugins: { legend: { labels: { color: css("--text") } } },
      scales: { x: { stacked: true, ticks: { color: css("--hint") }, grid: { display: false } }, y: { stacked: true, ticks: { color: css("--hint") }, grid: { color: "rgba(127,127,127,.15)" } } } },
  });
}

async function loadOpen() {
  const o = await api(`/api/open?${qs()}`);
  document.getElementById("open").innerHTML = o.length
    ? o.map((t) => `<div class="item"><div class="main"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.subject)}${t.who && state.me.full && !state.designer ? " · " + esc(t.who) : ""}</div></div>
        <div class="r ${t.overdue ? "bad" : ""}">${t.deadline ? (t.overdue ? "мерзімі өтті<br>" : "") + esc(t.deadline) : '<span class="s">дедлайн жоқ</span>'}</div></div>`).join("")
    : `<div class="empty">Ашық тапсырма жоқ</div>`;
}

async function refresh() {
  try {
    if (state.tab === "week") await loadWeek();
    if (state.tab === "trend") await loadTrend();
    if (state.tab === "open") await loadOpen();
  } catch (e) { document.getElementById("range").textContent = e.message; }
}

document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => {
  state.tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("main section").forEach((s) => (s.hidden = s.id !== "tab-" + state.tab));
  document.getElementById("weeks").hidden = state.tab !== "week";
  refresh();
}));

document.getElementById("export").onclick = async () => {
  try { await api(`/api/export?monday=${state.monday}`, { method: "POST" }); tg?.showAlert("Excel чатқа жіберілді"); }
  catch (e) { tg?.showAlert(e.message); }
};

(async () => {
  try {
    state.me = await api("/api/me");
    document.getElementById("title").textContent = state.me.full ? "DESIGN бөлімі" : state.me.name;
    state.monday = state.me.weeks[0]?.monday;
    const weekLabel = (w, i) => (i === 0 ? "Осы апта" : i === 1 ? "Өткен апта" : w.monday.slice(8, 10) + "." + w.monday.slice(5, 7));
    const drawWeeks = () => chips(document.getElementById("weeks"), state.me.weeks.map((w, i) => ({ value: w.monday, label: weekLabel(w, i) })), state.monday, (v) => { state.monday = v; drawWeeks(); refresh(); });
    drawWeeks();
    if (state.me.full) {
      const el = document.getElementById("people");
      el.hidden = false;
      const draw = () => chips(el, [{ value: "", label: "Барлығы" }, ...state.me.designers.map((d) => ({ value: d.id, label: d.name }))], state.designer, (v) => {
        state.designer = v; draw();
        document.getElementById("title").textContent = v ? state.me.designers.find((d) => d.id === v).name : "DESIGN бөлімі";
        refresh();
      });
      draw();
    }
    document.getElementById("actions").hidden = !state.me.admin;
    await refresh();
  } catch (e) {
    document.getElementById("title").textContent = "Ашу мүмкін емес";
    document.getElementById("range").textContent = e.message;
  }
})();
</script>
</body>
</html>
